# Page: visuals
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: visuals
label: Visuals
icon: visuals
order: 4
remote_configurable: true
description: HUD overlays, alerts, and on-screen display elements
sections:
- id: hud_elements
  title: HUD Elements
  description: Overlays shown on the driving screen
  items:
  - key: BlindSpot
    widget: toggle
    title: Show Blind Spot Warnings
    description: Enabling this will display warnings when a vehicle is detected in your blind spot as long as your car has
      BSM supported.
  - key: TorqueBar
    widget: toggle
    title: Steering Arc
    description: Display steering arc on the driving screen when lateral control is enabled.
  - key: ShowTurnSignals
    widget: toggle
    title: Display Turn Signals
    description: When enabled, visual turn indicators are drawn on the HUD.
  - key: RoadNameToggle
    widget: toggle
    title: Display Road Name
    description: Displays the name of the road the car is traveling on. The OpenStreetMap database of the location must be
      downloaded to fetch the road name.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: StandstillTimer
    widget: toggle
    title: Standstill Timer
    description: Show a timer on the HUD when the car is at a standstill.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: RocketFuel
    widget: toggle
    title: Real-time Acceleration Bar
    description: Show an indicator on the left side of the screen to display real-time vehicle acceleration and deceleration.
      This displays what the car is currently doing, not what the planner is requesting.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: ChevronInfo
    widget: option
    title: Display Metrics Below Chevron
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Distance
    - value: 2
      label: Speed
    - value: 3
      label: Time
    - value: 4
      label: All
    visibility:
    - $ref: '#/macros/hide_on_mici'
    enablement:
    - $ref: '#/macros/longitudinal'
- id: developer_ui
  title: Developer UI Info
  description: Speedometer and debug display options
  visibility:
  - $ref: '#/macros/hide_on_mici'
  items:
  - key: DevUIInfo
    widget: option
    title: Developer UI
    description: Display real-time parameters and metrics from various sources.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Bottom
    - value: 2
      label: Right
    - value: 3
      label: Right & Bottom
  - key: HideVEgoUI
    widget: toggle
    title: 'Speedometer: Hide from Onroad Screen'
    description: When enabled, the speedometer on the onroad screen is not displayed.
  - key: TrueVEgoUI
    widget: toggle
    title: 'Speedometer: Always Display True Speed'
    description: For applicable vehicles, always display the true vehicle current speed from wheel speed sensors.
    enablement:
    - type: param
      key: HideVEgoUI
      equals: false
  - key: GpsBadgeEnabled
    widget: toggle
    title: 'Speedometer: Display Speed Badge'
    description: >-
      Show the GPS/WHEEL speed-source badge beside the speedometer, indicating whether the displayed
      true speed is currently confirmed by GPS. Requires True Speed to be on.
    enablement:
    - type: param
      key: HideVEgoUI
      equals: false
    - type: param
      key: TrueVEgoUI
      equals: true
  sub_panels:
  - id: speed_badge_tuning
    label: Speed Badge Tuning
    trigger_key: GpsBadgeEnabled
    trigger_condition:
      type: param
      key: GpsBadgeEnabled
      equals: true
    items:
    - key: GpsBadgeSpeedAccMax
      widget: option
      title: 'Speed Badge: GPS Accuracy Gate'
      description: >-
        Trust GPS for the speed-source badge only when its reported speed accuracy is within this
        value (tenths of m/s; 15 = 1.5 m/s, about 5.4 km/h / 3.4 mph). Raise it if the GPS badge
        rarely appears.
      min: 3
      max: 30
      step: 1
      enablement:
      - type: param
        key: GpsBadgeEnabled
        equals: true
    - key: GpsBadgeMatchTol
      widget: option
      title: 'Speed Badge: GPS Match Tolerance'
      description: >-
        Show the green GPS badge when the displayed speed is within this much of GPS (tenths of
        km/h; 10 = 1.0 km/h, about 0.6 mph). The badge releases a little beyond this (hysteresis)
        to avoid flicker.
      min: 0
      max: 50
      step: 1
      enablement:
      - type: param
        key: GpsBadgeEnabled
        equals: true
    - key: GpsBadgeDebounce
      widget: option
      title: 'Speed Badge: Stability (Debounce)'
      description: >-
        How long a change must persist before the badge switches (tenths of a second; 15 = 1.5 s).
        Higher = calmer badge (less flicker on hilly/bendy roads) but slower to react.
      min: 5
      max: 40
      step: 5
      enablement:
      - type: param
        key: GpsBadgeEnabled
        equals: true
    - key: GpsBadgeGpsHold
      widget: option
      title: 'Speed Badge: GPS Hold'
      description: >-
        Keep using the last good GPS fix for this long through brief accuracy dropouts (tenths of
        a second; 50 = 5.0 s), so the badge does not flicker to WHEEL where GPS is poor. 0 = off.
      min: 0
      max: 100
      step: 10
      enablement:
      - type: param
        key: GpsBadgeEnabled
        equals: true
- id: alerts_extras
  title: Alerts & Extras
  description: Traffic light alerts and visual flair
  items:
  - key: GreenLightAlert
    widget: toggle
    title: Green Traffic Light Alert (Beta)
    description: 'A chime and on-screen alert will play when the traffic light you are waiting for turns green and you have
      no vehicle in front of you. On-screen visual alert is only available on comma 3X. Note: This chime is only designed
      as a notification. It is the driver''s responsibility to observe their environment and make decisions accordingly.'
  - key: LeadDepartAlert
    widget: toggle
    title: Lead Departure Alert (Beta)
    description: 'A chime and on-screen alert will play when you are stopped, and the vehicle in front of you start moving.
      On-screen visual alert is only available on comma 3X. Note: This chime is only designed as a notification. It is the
      driver''s responsibility to observe their environment and make decisions accordingly.'
  - key: RainbowMode
    widget: toggle
    title: Tesla Rainbow Mode
    description: Display a rainbow effect on the path the model wants to take. It does not affect driving in any way.
